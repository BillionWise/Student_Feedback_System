{% extends "base.html" %}
{% block title %}Upload Dataset · Feedback Analytics{% endblock %}
{% block content %}

<div class="d-flex justify-content-center mt-4">
  <div class="card shadow-sm p-4 form-wide w-100">
    <div class="card-body">
      <h2 class="card-title mb-3 text-primary">
        <i class="bi bi-upload me-2"></i>Upload Feedback Dataset (CSV)
      </h2>
      <p class="text-muted small mb-4">
        Upload a <code>.csv</code> file containing <strong>Name</strong>, <strong>Course</strong>, and <strong>Feedback</strong> columns.
      </p>

      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="file" class="form-label">Choose CSV File</label>
          <input type="file" name="file" id="file" class="form-control" accept=".csv" required>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-cloud-arrow-up-fill me-1"></i> Upload
          </button>
          <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
